<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="100%" height="100%">
  <style>
    text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; fill: #222; font-size: 11px; }
    .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 6; ry: 6; }
    .bridge-bg { fill: #f0f7ff; stroke: #0056b3; stroke-width: 2; rx: 10; ry: 10; }
    .sf-bg { fill: #f4f5f7; stroke: #00a1e0; stroke-width: 2; rx: 10; ry: 10; }
    .line { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .title { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .sub-title { font-size: 12px; font-weight: bold; fill: #0056b3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Left: Enterprise -->
  <rect x="15" y="90" width="110" height="70" class="box" />
  <text x="70" y="120" class="title">ERP / Payments /</text>
  <text x="70" y="136" class="title">Telemetry</text>

  <!-- Middle: Bridge Container -->
  <rect x="150" y="20" width="370" height="210" class="bridge-bg" />
  <text x="165" y="42" class="sub-title">Agentforce Enterprise Bridge</text>

  <rect x="165" y="60" width="160" height="35" class="box" />
  <text x="245" y="82" text-anchor="middle">Ingest: Contract, Dedupe, DLQ</text>

  <rect x="165" y="105" width="160" height="35" class="box" />
  <text x="245" y="127" text-anchor="middle">Grounding: Entity &amp; Recall</text>

  <rect x="165" y="150" width="160" height="35" class="box" />
  <text x="245" y="172" text-anchor="middle">Planner: Rules / LLM Fallback</text>

  <rect x="345" y="60" width="160" height="70" class="box" />
  <text x="425" y="90" text-anchor="middle" font-weight="bold">AI Control Tower</text>
  <text x="425" y="108" text-anchor="middle">RBAC, PII, Risk Gate</text>

  <rect x="345" y="150" width="160" height="35" class="box" fill="#fff3cd" />
  <text x="425" y="172" text-anchor="middle" font-weight="bold">Human Approval</text>

  <!-- Right: Salesforce -->
  <rect x="550" y="20" width="215" height="210" class="sf-bg" />
  <text x="565" y="42" class="sub-title" fill="#0070d2">Salesforce Org</text>

  <rect x="570" y="55" width="175" height="30" class="box" />
  <text x="657" y="74" text-anchor="middle">Case / Financial Review</text>

  <rect x="570" y="95" width="175" height="30" class="box" />
  <text x="657" y="114" text-anchor="middle">Bridge_Audit_Log__c</text>

  <rect x="570" y="135" width="175" height="30" class="box" />
  <text x="657" y="154" text-anchor="middle">Telemetry_Event__c</text>

  <rect x="570" y="175" width="175" height="40" class="box" />
  <text x="657" y="193" text-anchor="middle">Agentforce Agent</text>
  <text x="657" y="207" text-anchor="middle">(External Service)</text>

  <!-- Interconnections -->
  <path d="M 125 125 L 165 77" class="line" />
  <path d="M 245 95 L 245 105" class="line" />
  <path d="M 245 140 L 245 150" class="line" />
  <path d="M 325 167 L 345 95" class="line" />
  <path d="M 425 130 L 425 150" class="line" />
  
  <path d="M 505 80 L 570 70" class="line" />
  <path d="M 505 167 L 570 70" class="line" />
  <path d="M 325 122 Q 430 180 570 150" class="line" />
  <path d="M 505 105 L 570 110" class="line" />
  <path d="M 570 195 C 530 195, 530 80, 505 80" class="line" />
</svg>