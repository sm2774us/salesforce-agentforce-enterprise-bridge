<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="100%" height="100%">
  <style>
    text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; fill: #222; font-size: 11px; }
    .lifeline { stroke: #777; stroke-dasharray: 4,4; stroke-width: 1.5; }
    .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 4; ry: 4; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .alt-box { fill: #fafafa; stroke: #888; stroke-dasharray: 2,2; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Lifelines -->
  <rect x="20" y="15" width="80" height="30" class="box" />
  <text x="60" y="34" text-anchor="middle">Source</text>
  <line x1="60" y1="45" x2="60" y2="290" class="lifeline" />

  <rect x="130" y="15" width="80" height="30" class="box" />
  <text x="170" y="34" text-anchor="middle">Bridge API</text>
  <line x1="170" y1="45" x2="170" y2="290" class="lifeline" />

  <rect x="240" y="15" width="80" height="30" class="box" />
  <text x="280" y="34" text-anchor="middle">Grounding</text>
  <line x1="280" y1="45" x2="280" y2="290" class="lifeline" />

  <rect x="350" y="15" width="80" height="30" class="box" />
  <text x="390" y="34" text-anchor="middle">Planner</text>
  <line x1="390" y1="45" x2="390" y2="290" class="lifeline" />

  <rect x="460" y="15" width="90" height="30" class="box" />
  <text x="505" y="34" text-anchor="middle">Control Tower</text>
  <line x1="505" y1="45" x2="505" y2="290" class="lifeline" />

  <rect x="575" y="15" width="80" height="30" class="box" />
  <text x="615" y="34" text-anchor="middle">Human</text>
  <line x1="615" y1="45" x2="615" y2="290" class="lifeline" />

  <rect x="680" y="15" width="80" height="30" class="box" />
  <text x="720" y="34" text-anchor="middle">Salesforce</text>
  <line x1="720" y1="45" x2="720" y2="290" class="lifeline" />

  <!-- Interactions -->
  <path d="M 60 70 L 170 70" class="arrow" />
  <text x="115" y="63" text-anchor="middle">1. POST /v1/events</text>

  <path d="M 170 95 L 280 95" class="arrow" />
  <text x="225" y="88" text-anchor="middle">2. Ground &amp; PII strip</text>

  <path d="M 280 120 L 390 120" class="arrow" />
  <text x="335" y="113" text-anchor="middle">3. GroundedContext</text>

  <path d="M 390 145 L 505 145" class="arrow" />
  <text x="447" y="138" text-anchor="middle">4. ActionRequest</text>

  <!-- Alt Box -->
  <rect x="450" y="165" width="320" height="90" class="alt-box" />
  <text x="460" y="180" font-weight="bold">LOW / HIGH Risk Split</text>

  <path d="M 505 195 L 720 195" class="arrow" />
  <text x="612" y="190" text-anchor="middle">[LOW] create Case</text>

  <path d="M 505 220 L 615 220" class="arrow" />
  <text x="560" y="215" text-anchor="middle">[HIGH] 202 Pending</text>

  <path d="M 615 240 L 505 240" class="arrow" />
  <text x="560" y="235" text-anchor="middle">Approve</text>

  <path d="M 505 275 L 720 275" class="arrow" />
  <text x="612" y="270" text-anchor="middle">5. Write Audit Row</text>
</svg>