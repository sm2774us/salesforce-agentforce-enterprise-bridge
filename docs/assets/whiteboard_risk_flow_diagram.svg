<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="100%" height="100%">
  <style>
    text { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; fill: #222; }
    .box { fill: #fff; stroke: #333; stroke-width: 2.5; stroke-dasharray: 4,2; rx: 8; ry: 8; }
    .hub { fill: #fff0f0; stroke: #d9534f; stroke-width: 2.5; rx: 12; ry: 12; }
    .arrow { stroke: #333; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    .danger-arrow { stroke: #d9534f; stroke-width: 2.5; fill: none; marker-end: url(#danger-head); }
    .label { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .hub-label { font-size: 14px; font-weight: bold; text-anchor: middle; fill: #a94442; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <marker id="danger-head" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d9534f" />
    </marker>
  </defs>

  <!-- Left Input Box -->
  <rect x="20" y="70" width="160" height="60" class="box" />
  <text x="100" y="98" class="label">ERP / Payments /</text>
  <text x="100" y="116" class="label">Telemetry Silos</text>

  <!-- Middle Risk Nodes -->
  <rect x="230" y="15" width="220" height="35" class="box" />
  <text x="340" y="37" class="label">Hallucinated / Stale Context</text>

  <rect x="230" y="60" width="220" height="35" class="box" />
  <text x="340" y="82" class="label">PII Leaks (Prompts &amp; CRM)</text>

  <rect x="230" y="105" width="220" height="35" class="box" />
  <text x="340" y="127" class="label">Irreversible Action (No Approval)</text>

  <rect x="230" y="150" width="220" height="35" class="box" />
  <text x="340" y="172" class="label">No Audit Trail for Regulators</text>

  <!-- Central Executive Risk Hub -->
  <rect x="520" y="60" width="230" height="80" class="hub" />
  <text x="635" y="95" class="hub-label">EXECUTIVE RISK:</text>
  <text x="635" y="118" class="hub-label">Cost, Compliance, Trust</text>

  <!-- Connections -->
  <path d="M 180 100 Q 205 100 230 32" class="arrow" />
  <path d="M 180 100 L 230 77" class="arrow" />
  <path d="M 180 100 L 230 122" class="arrow" />
  <path d="M 180 100 Q 205 100 230 167" class="arrow" />

  <path d="M 450 32 Q 485 32 520 80" class="danger-arrow" />
  <path d="M 450 77 L 520 90" class="danger-arrow" />
  <path d="M 450 122 L 520 110" class="danger-arrow" />
  <path d="M 450 167 Q 485 167 520 120" class="danger-arrow" />
</svg>